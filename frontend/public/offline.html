<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Tony Yoga</title>
    <style>
      html, body { margin: 0; height: 100%; background: #FAFAF7; color: #1C221F; font-family: Georgia, 'Cormorant Garamond', serif; }
      .wrap { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
      .eyebrow { font-size: 12px; letter-spacing: 0.25em; text-transform: uppercase; color: #839682; margin-bottom: 16px; }
      h1 { font-size: 40px; margin: 0 0 12px; letter-spacing: -0.01em; }
      p { max-width: 420px; line-height: 1.6; color: #545E56; font-family: -apple-system, "Helvetica Neue", sans-serif; }
      button { margin-top: 24px; background: #B25A45; color: #FAFAF7; border: none; padding: 12px 24px; border-radius: 999px; font-size: 14px; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="eyebrow">Tony Yoga</div>
      <h1>You're offline.</h1>
      <p>Breathe in. Breathe out. The mat will be here when you're back online.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
