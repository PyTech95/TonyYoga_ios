name: TonYoga iOS TestFlight

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/ios-testflight.yml"

jobs:
  build-and-upload:
    runs-on: macos-15

    defaults:
      run:
        working-directory: frontend

    env:
      APP_BUNDLE_ID: com.tonyoga.app
      TEAM_ID: B38XS68W4W
      SCHEME: App
      PROJECT_PATH: ios/App/App.xcodeproj
      ARCHIVE_PATH: ${{ github.workspace }}/TonYoga.xcarchive
      EXPORT_PATH: ${{ github.workspace }}/export
      KEYCHAIN_PATH: /Users/runner/app-signing.keychain-db

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # 2. SELECT XCODE 26+
      # =========================================================
      - name: Select Xcode 26 or newer
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Installed Xcode applications"
          echo "========================================"

          ls -1d /Applications/Xcode*.app || true

          XCODE_PATH=""

          for candidate in \
            /Applications/Xcode_26*.app \
            /Applications/Xcode-26*.app \
            /Applications/Xcode26*.app
          do
            if [ -d "$candidate" ]; then
              XCODE_PATH="$candidate"
            fi
          done

          if [ -z "$XCODE_PATH" ]; then
            echo ""
            echo "ERROR: Xcode 26 or newer is not installed on this runner."
            echo "Apple requires builds made with the iOS 26 SDK or later."
            echo ""
            echo "Available Xcode installations:"
            ls -1d /Applications/Xcode*.app || true
            exit 1
          fi

          echo ""
          echo "Selecting:"
          echo "$XCODE_PATH"

          sudo xcode-select \
            -s "$XCODE_PATH/Contents/Developer"

          echo ""
          echo "========================================"
          echo "Selected Xcode"
          echo "========================================"

          xcodebuild -version

          echo ""
          echo "========================================"
          echo "Available SDKs"
          echo "========================================"

          xcodebuild -showsdks

          XCODE_MAJOR=$(
            xcodebuild -version |
            awk '/Xcode/ {print $2}' |
            cut -d. -f1
          )

          if [ "$XCODE_MAJOR" -lt 26 ]; then
            echo "ERROR: Selected Xcode is older than Xcode 26."
            exit 1
          fi

          echo ""
          echo "Xcode 26+ verified successfully."

      # =========================================================
      # 3. SETUP NODE
      # =========================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # =========================================================
      # 4. INSTALL DEPENDENCIES
      # =========================================================
      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      # =========================================================
      # 5. BUILD REACT WITH PRODUCTION API
      # =========================================================
      - name: Build React app
        env:
          CI: "false"
          REACT_APP_BACKEND_URL: "https://tonyoga.com"
        run: |
          set -e

          echo "========================================"
          echo "Building TonYoga iOS"
          echo "========================================"
          echo "Production backend:"
          echo "$REACT_APP_BACKEND_URL"

          npm run build

      # =========================================================
      # 6. VERIFY PRODUCTION API IN COMPILED BUILD
      # =========================================================
      - name: Verify production API URL in React build
        shell: bash
        run: |
          set -e

          echo "Checking compiled React bundle..."
          echo "Expected backend: https://tonyoga.com"

          if grep -R -q "https://tonyoga.com" build/static/js; then
            echo "SUCCESS: Production backend URL found."
          else
            echo "ERROR: Production backend URL missing from compiled build."
            exit 1
          fi

          if grep -R -q "undefined/api" build/static/js; then
            echo "ERROR: undefined/api found in compiled build."
            exit 1
          fi

          echo "React production API configuration verified."

      # =========================================================
      # 7. CAPACITOR SYNC
      # =========================================================
      - name: Sync Capacitor iOS
        run: |
          set -e

          npx cap sync ios

          echo ""
          echo "Capacitor iOS sync completed."

      # =========================================================
      # 8. VERIFY API INSIDE IOS WEB ASSETS
      # =========================================================
      - name: Verify production API in iOS assets
        shell: bash
        run: |
          set -e

          echo "Checking Capacitor iOS web assets..."

          if grep -R -q "https://tonyoga.com" ios/App/App/public; then
            echo "SUCCESS: Production backend URL exists in iOS assets."
          else
            echo "ERROR: Production backend URL missing from iOS assets."
            exit 1
          fi

          if grep -R -q "undefined/api" ios/App/App/public; then
            echo "ERROR: undefined/api found inside iOS assets."
            exit 1
          fi

          echo "iOS production API configuration verified."

      # =========================================================
      # 9. DECODE DISTRIBUTION CERTIFICATE
      # =========================================================
      - name: Decode Apple Distribution certificate
        shell: bash
        run: |
          set -e

          echo "${{ secrets.APPLE_CERTIFICATE_BASE64 }}" \
            | base64 --decode \
            > "$RUNNER_TEMP/certificate.p12"

          if [ ! -s "$RUNNER_TEMP/certificate.p12" ]; then
            echo "ERROR: certificate.p12 is empty."
            exit 1
          fi

          echo "Apple Distribution certificate decoded."

      # =========================================================
      # 10. PROVISIONING PROFILE
      # =========================================================
      - name: Decode and install provisioning profile
        shell: bash
        run: |
          set -e

          mkdir -p \
            "$HOME/Library/MobileDevice/Provisioning Profiles"

          echo "${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}" \
            | base64 --decode \
            > "$RUNNER_TEMP/profile.mobileprovision"

          if [ ! -s "$RUNNER_TEMP/profile.mobileprovision" ]; then
            echo "ERROR: Provisioning profile is empty."
            exit 1
          fi

          security cms \
            -D \
            -i "$RUNNER_TEMP/profile.mobileprovision" \
            > "$RUNNER_TEMP/profile.plist"

          PROFILE_UUID=$(
            /usr/libexec/PlistBuddy \
              -c "Print UUID" \
              "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_NAME=$(
            /usr/libexec/PlistBuddy \
              -c "Print Name" \
              "$RUNNER_TEMP/profile.plist"
          )

          cp \
            "$RUNNER_TEMP/profile.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

          echo "Profile Name: $PROFILE_NAME"
          echo "Profile UUID: $PROFILE_UUID"

      # =========================================================
      # 11. CREATE KEYCHAIN
      # =========================================================
      - name: Create temporary keychain and import certificate
        shell: bash
        run: |
          set -e

          security create-keychain \
            -p "${{ secrets.KEYCHAIN_PASSWORD }}" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "${{ secrets.KEYCHAIN_PASSWORD }}" \
            "$KEYCHAIN_PATH"

          security import \
            "$RUNNER_TEMP/certificate.p12" \
            -P "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "${{ secrets.KEYCHAIN_PASSWORD }}" \
            "$KEYCHAIN_PATH"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN_PATH" login.keychain-db

          echo "Signing identities:"

          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"

      # =========================================================
      # 12. FIND SIGNING IDENTITY
      # =========================================================
      - name: Read Apple Distribution signing identity
        shell: bash
        run: |
          set -e

          SIGNING_IDENTITY=$(
            security find-identity \
              -v \
              -p codesigning \
              "$KEYCHAIN_PATH" \
              | grep "Apple Distribution" \
              | head -1 \
              | sed -E 's/.*"(.+)"/\1/'
          )

          if [ -z "$SIGNING_IDENTITY" ]; then
            echo "ERROR: Apple Distribution identity not found."
            exit 1
          fi

          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" \
            >> "$GITHUB_ENV"

          echo "Using:"
          echo "$SIGNING_IDENTITY"

      # =========================================================
      # 13. VERIFY PROVISIONING PROFILE
      # =========================================================
      - name: Verify TonYoga provisioning profile
        shell: bash
        run: |
          set -e

          APP_IDENTIFIER=$(
            /usr/libexec/PlistBuddy \
              -c "Print Entitlements:application-identifier" \
              "$RUNNER_TEMP/profile.plist"
          )

          EXPECTED_IDENTIFIER="$TEAM_ID.$APP_BUNDLE_ID"

          echo "Profile identifier:"
          echo "$APP_IDENTIFIER"

          echo "Expected:"
          echo "$EXPECTED_IDENTIFIER"

          if [ "$APP_IDENTIFIER" != "$EXPECTED_IDENTIFIER" ]; then
            echo "ERROR: Wrong provisioning profile."
            exit 1
          fi

          echo "TonYoga provisioning profile verified."

      # =========================================================
      # 14. SET VERSION / BUILD
      # =========================================================
      - name: Set iOS version and build number
        shell: bash
        run: |
          set -e

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleShortVersionString 1.0" \
            ios/App/App/Info.plist || true

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" \
            ios/App/App/Info.plist || true

          echo "Version: 1.0"
          echo "Build: ${GITHUB_RUN_NUMBER}"

      # =========================================================
      # 15. VERIFY XCODE SDK
      # =========================================================
      - name: Verify build SDK
        shell: bash
        run: |
          set -e

          echo "Xcode:"
          xcodebuild -version

          echo ""
          echo "SDK path:"
          xcrun --sdk iphoneos --show-sdk-path

          echo ""
          echo "SDK version:"
          xcrun --sdk iphoneos --show-sdk-version

          SDK_MAJOR=$(
            xcrun --sdk iphoneos --show-sdk-version |
            cut -d. -f1
          )

          if [ "$SDK_MAJOR" -lt 26 ]; then
            echo "ERROR: iOS SDK 26+ is required."
            exit 1
          fi

          echo "iOS SDK 26+ verified."

      # =========================================================
      # 16. ARCHIVE
      # =========================================================
      - name: Archive TonYoga
        shell: bash
        run: |
          set -e

          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            clean archive

      # =========================================================
      # 17. EXPORT OPTIONS
      # =========================================================
      - name: Create App Store export options
        shell: bash
        run: |
          set -e

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>

            <key>method</key>
            <string>app-store-connect</string>

            <key>teamID</key>
            <string>${TEAM_ID}</string>

            <key>signingStyle</key>
            <string>manual</string>

            <key>signingCertificate</key>
            <string>Apple Distribution</string>

            <key>provisioningProfiles</key>
            <dict>
              <key>${APP_BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>

            <key>uploadSymbols</key>
            <true/>

            <key>manageAppVersionAndBuildNumber</key>
            <false/>

          </dict>
          </plist>
          EOF

          cat "$RUNNER_TEMP/ExportOptions.plist"

      # =========================================================
      # 18. EXPORT IPA
      # =========================================================
      - name: Export signed IPA
        shell: bash
        run: |
          set -e

          mkdir -p "$EXPORT_PATH"

          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

          echo "Exported files:"
          ls -lah "$EXPORT_PATH"

          IPA_PATH=$(
            find "$EXPORT_PATH" \
              -name "*.ipa" \
              -print \
              -quit
          )

          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: IPA not generated."
            exit 1
          fi

          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

          echo "IPA:"
          echo "$IPA_PATH"

      # =========================================================
      # 19. INSTALL APP STORE CONNECT API KEY
      # =========================================================
      - name: Install App Store Connect API key
        shell: bash
        run: |
          set -e

          mkdir -p \
            "$HOME/.appstoreconnect/private_keys"

          API_KEY_FILE="$HOME/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8"

          echo "${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}" \
            | base64 --decode \
            > "$API_KEY_FILE"

          chmod 600 "$API_KEY_FILE"

          if [ ! -s "$API_KEY_FILE" ]; then
            echo "ERROR: P8 key is empty."
            exit 1
          fi

          FIRST_LINE=$(
            head -n 1 "$API_KEY_FILE" |
            tr -d '\r'
          )

          LAST_LINE=$(
            tail -n 1 "$API_KEY_FILE" |
            tr -d '\r'
          )

          if [ "$FIRST_LINE" != "-----BEGIN PRIVATE KEY-----" ]; then
            echo "ERROR: Invalid P8 header."
            exit 1
          fi

          if [ "$LAST_LINE" != "-----END PRIVATE KEY-----" ]; then
            echo "ERROR: Invalid P8 footer."
            exit 1
          fi

          echo "App Store Connect API key ready."

      # =========================================================
      # 20. UPLOAD IPA
      # =========================================================
      - name: Upload IPA to App Store Connect
        shell: bash
        run: |
          set -e

          if [ ! -f "$IPA_PATH" ]; then
            echo "ERROR: IPA file not found."
            exit 1
          fi

          echo "Uploading:"
          echo "$IPA_PATH"

          xcrun altool \
            --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}" \
            --apiIssuer "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"

      # =========================================================
      # 21. SAVE IPA ARTIFACT
      # =========================================================
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TonYoga-iOS-${{ github.run_number }}
          path: export/*.ipa
          if-no-files-found: error

      # =========================================================
      # 22. CLEANUP
      # =========================================================
      - name: Cleanup signing files
        if: always()
        shell: bash
        run: |
          security delete-keychain \
            "$KEYCHAIN_PATH" || true

          rm -f \
            "$RUNNER_TEMP/certificate.p12"

          rm -f \
            "$RUNNER_TEMP/profile.mobileprovision"

          rm -f \
            "$RUNNER_TEMP/profile.plist"

          rm -f \
            "$HOME/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8"

          echo "Temporary signing files removed."