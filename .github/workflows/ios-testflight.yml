name: TonYoga iOS TestFlight

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/ios-testflight.yml"

jobs:
  build-and-upload:
    runs-on: macos-15

    defaults:
      run:
        working-directory: frontend

    env:
      APP_BUNDLE_ID: com.tonyoga.app
      TEAM_ID: B38XS68W4W
      SCHEME: App
      PROJECT_PATH: ios/App/App.xcodeproj
      ARCHIVE_PATH: ${{ github.workspace }}/TonYoga.xcarchive
      EXPORT_PATH: ${{ github.workspace }}/export
      KEYCHAIN_PATH: /Users/runner/app-signing.keychain-db

    steps:
      # ---------------------------------------------------------
      # 1. CHECKOUT
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. NODE
      # ---------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ---------------------------------------------------------
      # 3. INSTALL DEPENDENCIES
      # ---------------------------------------------------------
      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      # ---------------------------------------------------------
      # 4. BUILD REACT
      # CI=false prevents ESLint warnings from failing the build.
      # ---------------------------------------------------------
      - name: Build React app
        env:
          CI: "false"
        run: npm run build

      # ---------------------------------------------------------
      # 5. CAPACITOR SYNC
      # ---------------------------------------------------------
      - name: Sync Capacitor iOS
        run: npx cap sync ios

      # ---------------------------------------------------------
      # 6. DECODE DISTRIBUTION CERTIFICATE
      # ---------------------------------------------------------
      - name: Decode Apple Distribution certificate
        shell: bash
        run: |
          echo "${{ secrets.APPLE_CERTIFICATE_BASE64 }}" \
            | base64 --decode \
            > "$RUNNER_TEMP/certificate.p12"

          if [ ! -s "$RUNNER_TEMP/certificate.p12" ]; then
            echo "ERROR: certificate.p12 was not created correctly."
            exit 1
          fi

          echo "Distribution certificate decoded successfully."

      # ---------------------------------------------------------
      # 7. INSTALL PROVISIONING PROFILE
      # ---------------------------------------------------------
      - name: Decode and install provisioning profile
        shell: bash
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          echo "${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}" \
            | base64 --decode \
            > "$RUNNER_TEMP/profile.mobileprovision"

          if [ ! -s "$RUNNER_TEMP/profile.mobileprovision" ]; then
            echo "ERROR: Provisioning profile was not decoded."
            exit 1
          fi

          security cms -D \
            -i "$RUNNER_TEMP/profile.mobileprovision" \
            > "$RUNNER_TEMP/profile.plist"

          PROFILE_UUID=$(
            /usr/libexec/PlistBuddy \
              -c "Print UUID" \
              "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_NAME=$(
            /usr/libexec/PlistBuddy \
              -c "Print Name" \
              "$RUNNER_TEMP/profile.plist"
          )

          cp \
            "$RUNNER_TEMP/profile.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

          echo "Provisioning profile installed."
          echo "Profile Name: $PROFILE_NAME"
          echo "Profile UUID: $PROFILE_UUID"

      # ---------------------------------------------------------
      # 8. CREATE KEYCHAIN + IMPORT CERTIFICATE
      # ---------------------------------------------------------
      - name: Create temporary keychain and import certificate
        shell: bash
        run: |
          security create-keychain \
            -p "${{ secrets.KEYCHAIN_PASSWORD }}" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "${{ secrets.KEYCHAIN_PASSWORD }}" \
            "$KEYCHAIN_PATH"

          security import \
            "$RUNNER_TEMP/certificate.p12" \
            -P "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "${{ secrets.KEYCHAIN_PASSWORD }}" \
            "$KEYCHAIN_PATH"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN_PATH" login.keychain-db

          echo "Available code signing identities:"
          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"

      # ---------------------------------------------------------
      # 9. GET DISTRIBUTION SIGNING IDENTITY
      # ---------------------------------------------------------
      - name: Read Apple Distribution signing identity
        shell: bash
        run: |
          SIGNING_IDENTITY=$(
            security find-identity \
              -v \
              -p codesigning \
              "$KEYCHAIN_PATH" \
              | grep "Apple Distribution" \
              | head -1 \
              | sed -E 's/.*"(.+)"/\1/'
          )

          if [ -z "$SIGNING_IDENTITY" ]; then
            echo "ERROR: Apple Distribution signing identity not found."
            exit 1
          fi

          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "Using signing identity: $SIGNING_IDENTITY"

      # ---------------------------------------------------------
      # 10. VERIFY PROFILE MATCHES TONYOGA
      # ---------------------------------------------------------
      - name: Verify TonYoga provisioning profile
        shell: bash
        run: |
          APP_IDENTIFIER=$(
            /usr/libexec/PlistBuddy \
              -c "Print Entitlements:application-identifier" \
              "$RUNNER_TEMP/profile.plist"
          )

          echo "Provisioning profile application identifier:"
          echo "$APP_IDENTIFIER"

          EXPECTED_IDENTIFIER="$TEAM_ID.$APP_BUNDLE_ID"

          echo "Expected:"
          echo "$EXPECTED_IDENTIFIER"

          if [[ "$APP_IDENTIFIER" != "$EXPECTED_IDENTIFIER" ]]; then
            echo "ERROR: Provisioning profile does not match TonYoga."
            exit 1
          fi

          echo "Provisioning profile matches TonYoga."

      # ---------------------------------------------------------
      # 11. SET VERSION + UNIQUE BUILD NUMBER
      # ---------------------------------------------------------
      - name: Set iOS version and build number
        shell: bash
        run: |
          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleShortVersionString 1.0" \
            ios/App/App/Info.plist || true

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" \
            ios/App/App/Info.plist || true

          echo "Marketing Version: 1.0"
          echo "Build Number: ${GITHUB_RUN_NUMBER}"

      # ---------------------------------------------------------
      # 12. ARCHIVE
      # ---------------------------------------------------------
      - name: Archive TonYoga
        shell: bash
        run: |
          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            clean archive

      # ---------------------------------------------------------
      # 13. EXPORT OPTIONS
      # ---------------------------------------------------------
      - name: Create App Store export options
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>

            <key>method</key>
            <string>app-store-connect</string>

            <key>teamID</key>
            <string>${TEAM_ID}</string>

            <key>signingStyle</key>
            <string>manual</string>

            <key>signingCertificate</key>
            <string>Apple Distribution</string>

            <key>provisioningProfiles</key>
            <dict>
              <key>${APP_BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>

            <key>uploadSymbols</key>
            <true/>

            <key>manageAppVersionAndBuildNumber</key>
            <false/>

          </dict>
          </plist>
          EOF

          echo "ExportOptions.plist created:"
          cat "$RUNNER_TEMP/ExportOptions.plist"

      # ---------------------------------------------------------
      # 14. EXPORT SIGNED IPA
      # ---------------------------------------------------------
      - name: Export signed IPA
        shell: bash
        run: |
          mkdir -p "$EXPORT_PATH"

          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

          echo "Export directory:"
          ls -lah "$EXPORT_PATH"

          IPA_PATH=$(find "$EXPORT_PATH" -name "*.ipa" -print -quit)

          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: IPA was not generated."
            exit 1
          fi

          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"
          echo "IPA generated successfully:"
          echo "$IPA_PATH"

      # ---------------------------------------------------------
      # 15. INSTALL APP STORE CONNECT API PRIVATE KEY
      #
      # altool searches ~/.appstoreconnect/private_keys
      # for AuthKey_<KEY_ID>.p8
      # ---------------------------------------------------------
      - name: Install App Store Connect API key
        shell: bash
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"

          API_KEY_FILE="$HOME/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8"

          cat > "$API_KEY_FILE" <<'EOF'
          ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          EOF

          chmod 600 "$API_KEY_FILE"

          if [ ! -s "$API_KEY_FILE" ]; then
            echo "ERROR: App Store Connect API key file was not created."
            exit 1
          fi

          echo "App Store Connect API key installed."
          echo "Key ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}"

      # ---------------------------------------------------------
      # 16. TEST APP STORE CONNECT AUTHENTICATION
      # ---------------------------------------------------------
      - name: Validate App Store Connect authentication
        shell: bash
        run: |
          xcrun altool \
            --list-providers \
            --apiKey "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}" \
            --apiIssuer "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"

      # ---------------------------------------------------------
      # 17. UPLOAD TO APP STORE CONNECT / TESTFLIGHT
      # ---------------------------------------------------------
      - name: Upload IPA to App Store Connect
        shell: bash
        run: |
          if [ ! -f "$IPA_PATH" ]; then
            echo "ERROR: IPA does not exist at $IPA_PATH"
            exit 1
          fi

          echo "Uploading:"
          echo "$IPA_PATH"

          xcrun altool \
            --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}" \
            --apiIssuer "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"

      # ---------------------------------------------------------
      # 18. SAVE IPA AS GITHUB ARTIFACT
      # ---------------------------------------------------------
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TonYoga-iOS-${{ github.run_number }}
          path: export/*.ipa
          if-no-files-found: error

      # ---------------------------------------------------------
      # 19. CLEANUP
      # ---------------------------------------------------------
      - name: Cleanup signing files
        if: always()
        shell: bash
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true

          rm -f "$RUNNER_TEMP/certificate.p12"
          rm -f "$RUNNER_TEMP/profile.mobileprovision"
          rm -f "$RUNNER_TEMP/profile.plist"
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8"

          echo "Temporary signing files removed."